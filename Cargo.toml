[package]
name = "compressr"
version = "0.2.1"
edition = "2021"
authors = ["Farhan Syah"]
description = "GGUF quantization and LLM model conversion in Rust: converts SafeTensors, GGUF, TCF and PyTorch checkpoints, with no Python"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/compressr"
homepage = "https://github.com/ml-rust/compressr"
readme = "README.md"
keywords = ["llm", "quantization", "compression", "gguf", "safetensors"]
categories = ["command-line-utilities", "compression", "science"]
exclude = [
    "tmp/",
    "research/",
    "benchmarks/",
    ".github/",
    "CLAUDE.md",
    "AGENTS.md",
    ".cargo/",
]

[lib]
name = "compressr"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Python bindings via PyO3
python = ["dep:pyo3"]

[dependencies]
# boostr: every quantization kernel, block layout and model-format reader.
# compressr calls them on the CPU runtime. The integration tests use this same
# entry to decode with boostr's reader kernels.
boostr = "0.10"

# JSON: config.json sidecars and the SafeTensors shard index
serde_json = "1.0"

# Tokenizer: encodes llama.cpp's fingerprint text with the checkpoint's own
# tokenizer.json, to name the BPE pre-tokenizer in a GGUF header.
splintr = "0.22"

# SHA-256 of that encoding, which is the fingerprint llama.cpp's table keys on.
sha2 = "0.11"

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Half-precision float types, for dtype casts and side-band scales
half = "2.7"

# Temporary files, for the TCF payload spill: the container writes its
# directory before any payload, so each finished payload waits in an unlinked
# temporary file instead of memory, and peak RAM stays one tensor.
tempfile = "3.23"

# Python bindings (optional)
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[[bin]]
name = "compressr"
path = "src/main.rs"
required-features = []
